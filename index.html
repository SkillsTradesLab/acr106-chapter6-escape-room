</style></head><body>
<header><div><div class="brand"><span>SKILLS TRADES</span> LAB</div><div class="sub">ACR106 · Chapter 6</div></div><button id="homeBtn" class="ghost">Lobby</button></header>
<main class="shell"><div id="error" role="alert" class="notice"></div><div id="app"></div><footer>Chapter 6: Controls and Accessories · Classroom simulation based on the supplied chapter. Equipment settings and service procedures must follow manufacturer instructions.</footer></main>
<script>
'use strict';
// Same-origin in the review site; GitHub Pages connects to the hosted progress service.
const BACKEND='https://acr106-chapter6-escape-room.urbanrootzsociety.chatgpt.site';
const API=location.hostname.endsWith('.github.io')||location.protocol==='file:'?BACKEND+'/api/game':'/api/game';
const app=document.getElementById('app'),err=document.getElementById('error');
const roomNames=['The Frozen Box','Valve Vault','Pressure Chamber','Oil Lock','Liquid Store','The Final Circuit'];
const topics=['Temperature controls','Service valves & pump-down','Pressure regulation','Oil protection','Receivers & accumulators','Driers & accessories'];
let mode='lobby',tab='student',cred=null,player=null,host=null,selected=null,sequence=[],matches=[],busy=false,poll=null,feedback='',hint='',unlocked=null,clock=null,serverOffset=0;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function el(id){return document.getElementById(id);}function clearError(){err.textContent='';}function problem(e){err.textContent=e.message||String(e);}
async function api(body){const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});const d=await r.json();if(d.player){player=d.player;serverOffset=player.serverNow-Date.now();}if(!r.ok)throw new Error(d.error||'Connection unavailable. Try again.');return d;}catch(e){if(e.name==='AbortError')throw new Error('Connection timed out. Your input is still here. Try again.');if(e instanceof TypeError)throw new Error('The progress service is not reachable. Ask your teacher to check that the class connection is enabled.');throw e;}finally{clearTimeout(timeout);}}
function saveAuth(key,value){try{localStorage.setItem('acr106-'+key,JSON.stringify(value));}catch{}}function loadAuth(key){try{return JSON.parse(localStorage.getItem('acr106-'+key)||'null');}catch{return null;}}
function stop(){clearInterval(poll);clearInterval(clock);poll=null;clock=null;}
async function run(fn){if(busy)return;busy=true;clearError();try{await fn();}catch(e){problem(e);}finally{busy=false;document.querySelectorAll('[data-busy]').forEach(b=>b.disabled=mode==='student'&&!!(player?.expired||player?.closed));}}
function rooms(progress=0){return '<div class="roomlist">'+roomNames.map((r,i)=>'<div class="roomtile '+(progress>=(i+1)*5?'done':Math.floor(progress/5)===i?'current':'')+'"><small>ROOM '+String(i+1).padStart(2,'0')+(progress>=(i+1)*5?' · UNLOCKED':'')+'</small><b>'+r+'</b><small>'+topics[i]+'</small></div>').join('')+'</div>';}
function limitControls(minutes=0){return '<label for="limit">Time limit</label><select id="limit"><option value="0" '+(!minutes?'selected':'')+'>No time limit</option><option value="custom" '+(minutes?'selected':'')+'>Custom minutes</option></select><div id="minutesBox" class="'+(!minutes?'hidden':'')+'"><label for="minutes">Minutes per student (1–1440)</label><input id="minutes" type="number" min="1" max="1440" value="'+(minutes||60)+'"></div>';}
function wireLimit(){el('limit').onchange=()=>el('minutesBox').classList.toggle('hidden',el('limit').value==='0');}function minutesValue(){if(el('limit').value==='0')return 0;const n=Number(el('minutes').value);if(!Number.isInteger(n)||n<1||n>1440)throw new Error('Enter a whole number from 1 to 1440 minutes.');return n;}
function lobby(){stop();mode='lobby';cred=null;app.innerHTML='<div class="grid"><section class="intro"><div class="eyebrow">Refrigeration rescue mission</div><h1>ACR106 Chapter 6<br>Escape Room</h1><p>A refrigeration system is locked down. Solve 30 control and accessory challenges, recover six access keys, and restore the system.</p><div class="pills"><span class="pill">30 challenges</span><span class="pill">6 locked rooms</span><span class="pill">Individual play</span></div>'+rooms(-1)+'</section><section class="card"><div class="tabs"><button id="studentTab" class="tab '+(tab==='student'?'active':'')+'">Student entry</button><button id="teacherTab" class="tab '+(tab==='teacher'?'active':'')+'">Teacher desk</button></div>'+(tab==='student'?'<h2>Join your class</h2><p class="muted">Enter the code from your teacher. Your progress is saved after each challenge.</p><form id="joinForm"><label for="name">Your name or assigned nickname</label><input id="name" maxlength="60" autocomplete="name" required><label for="code">Class code</label><input id="code" maxlength="8" placeholder="8-character code" autocapitalize="characters" required><button data-busy class="primary wide">Enter escape room</button></form><button id="resumeStudent" class="wide ghost">Resume saved student progress</button><details><summary>Resume with a student key</summary><label for="resumeCode">Class code</label><input id="resumeCode"><label for="resumeKey">Student key</label><input id="resumeKey"><button id="recoverStudent" class="wide">Resume</button></details>':'<h2>Start a class session</h2><p class="muted">Each student plays independently. Monitor eight or more students from one dashboard.</p><form id="createForm">'+limitControls()+'<button data-busy class="primary wide">Create class session</button></form><button id="resumeTeacher" class="wide ghost">Open saved teacher dashboard</button><details><summary>Open with a teacher key</summary><label for="hostCode">Class code</label><input id="hostCode"><label for="hostKey">Private teacher key</label><input id="hostKey" type="password"><button id="recoverTeacher" class="wide">Open dashboard</button></details>')+'</section></div>';
 el('studentTab').onclick=()=>{tab='student';lobby();};el('teacherTab').onclick=()=>{tab='teacher';lobby();};
 if(tab==='student'){
 el('joinForm').onsubmit=e=>{e.preventDefault();run(async()=>{el('joinForm').querySelector('button').disabled=true;const d=await api({action:'join',name:el('name').value,code:el('code').value});cred={code:d.code,token:d.token};saveAuth('student',cred);player=d.player;serverOffset=player.serverNow-Date.now();feedback='';hint='';unlocked=null;startStudent();});};
 el('resumeStudent').onclick=()=>run(()=>resumeStudent(loadAuth('student')));el('recoverStudent').onclick=()=>run(()=>resumeStudent({code:el('resumeCode').value,token:el('resumeKey').value}));
 }else{wireLimit();el('createForm').onsubmit=e=>{e.preventDefault();run(async()=>{const minutes=minutesValue();el('createForm').querySelector('button').disabled=true;const d=await api({action:'create',minutes});cred={code:d.code,token:d.token};saveAuth('teacher',cred);host=d;startHost();});};el('resumeTeacher').onclick=()=>run(()=>resumeHost(loadAuth('teacher')));el('recoverTeacher').onclick=()=>run(()=>resumeHost({code:el('hostCode').value,token:el('hostKey').value}));}
}
async function resumeStudent(c){if(!c)throw new Error('No saved student session on this browser. Enter your class code and student key.');cred=c;const d=await api({...cred,action:'state'});player=d.player;feedback='';hint='';unlocked=null;saveAuth('student',cred);startStudent();}
async function resumeHost(c){if(!c)throw new Error('No saved teacher session on this browser. Enter your class code and private teacher key.');cred=c;host=await api({...cred,action:'host'});saveAuth('teacher',cred);startHost();}
function timeText(ms){ms=Math.max(0,ms);const secs=Math.floor(ms/1000);return String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');}
function playerTimer(){if(!player)return;const now=Date.now()+serverOffset;const t=el('timer');if(t)t.textContent=player.finished?'Completed in '+timeText(player.finished-player.started):player.expires?'Remaining '+timeText(player.expires-now):'No time limit';if(player.expires&&now>=player.expires&&!player.finished&&!player.expired){player.expired=true;renderStudent();}}
function startStudent(){stop();mode='student';renderStudent();poll=setInterval(async()=>{if(busy||mode!=='student')return;const old=player;try{const d=await api({...cred,action:'state'});if(old.progress!==d.player.progress||old.closed!==d.player.closed||old.minutes!==d.player.minutes||old.expired!==d.player.expired){hint='';feedback='';unlocked=null;renderStudent();}clearError();}catch(e){problem(e);}},5000);clock=setInterval(playerTimer,1000);}
function renderStudent(){const p=player;selected=null;matches=[];sequence=p.question?.type==='sequence'?[...p.question.options]:[];const paused=p.expired||p.closed;
 app.innerHTML='<div class="titlebar"><div><div class="eyebrow">'+esc(p.name)+' · Class '+esc(cred.code)+'</div><h2>Refrigeration rescue</h2></div><span id="timer" class="timer"></span></div><div class="toolbar"><span class="pill">'+p.progress+' / 30 solved</span><span class="pill">'+p.mistakes+' incorrect attempts</span><span class="pill">'+p.hints+' hints</span></div><div class="progress"><div style="width:'+p.progress/30*100+'%"></div></div>'+rooms(p.progress)+(p.finished?'<section class="card challenge"><div class="eyebrow">All six keys recovered</div><h1>System restored.</h1><p>You escaped all six rooms and solved all 30 challenges.</p><p class="muted">Completion time: '+timeText(p.finished-p.started)+' · Incorrect attempts: '+p.mistakes+' · Hints: '+p.hints+'</p></section>':unlocked?'<section class="card challenge"><div class="eyebrow">Room unlocked</div><h2>'+esc(unlocked.name)+' complete</h2><p class="key">'+esc(unlocked.key)+'</p><p>'+esc(feedback)+'</p><button id="nextRoom" class="primary">Enter next room</button></section>':'<section class="card challenge"><div class="eyebrow">Room '+(Math.floor(p.progress/5)+1)+' · Challenge '+(p.progress%5+1)+' of 5</div><h2>'+esc(p.question.prompt)+'</h2>'+(paused?'<div class="notice">'+(p.closed?'Session closed. Your progress is saved.':'Time is up. Your teacher can extend the limit or choose no time limit.')+'</div>':'')+'<div id="answerArea"></div><div id="feedback" class="feedback '+(!feedback?'hidden':'')+'" aria-live="polite">'+esc(feedback)+'</div><div id="hintBox" class="feedback '+(!hint?'hidden':'')+'">'+esc(hint)+'</div><div class="toolbar spaced"><button id="submit" data-busy class="primary" '+(paused?'disabled':'')+'>Check answer</button><button id="getHint" data-busy class="ghost" '+(paused?'disabled':'')+'>Use a hint</button></div><p class="muted spaced"><small>Source section: '+esc(p.question.section)+'</small></p></section>')+'<details><summary>Save your student key</summary><p class="muted">Use this key with your class code to resume on another browser. Keep it private.</p><p class="break">'+esc(cred.token)+'</p><button id="downloadStudent">Download student key</button></details>';
 playerTimer();el('downloadStudent').onclick=()=>download('ACR106_Student_Key.txt','Class code: '+cred.code+'\nStudent key: '+cred.token+'\nKeep this key private.');
 if(unlocked&&!p.finished){el('nextRoom').onclick=()=>{unlocked=null;feedback='';hint='';renderStudent();};return;}if(p.finished)return;
 renderAnswer();el('submit').onclick=()=>run(async()=>{if(paused)return;let answer;if(p.question.type==='choice'){if(selected===null)throw new Error('Choose an answer first.');answer=selected;}else if(p.question.type==='number'){answer=el('numberAnswer').value;if(!answer.trim())throw new Error('Enter your answer.');}else if(p.question.type==='match'){answer=p.question.labels.map((_,i)=>el('match'+i).value);if(answer.some(x=>!x))throw new Error('Complete each match first.');}else answer=sequence;
 el('submit').disabled=true;try{const d=await api({...cred,action:'answer',index:p.progress,revision:player.revision,answer});player=d.player;if(d.correct){feedback=d.explanation;hint='';unlocked=d.unlocked;renderStudent();}else{feedback='That lock is still closed. Review the clue and try again.';el('feedback').textContent=feedback;el('feedback').classList.remove('hidden');el('submit').disabled=false;}}catch(e){if(player.progress!==p.progress||player.expired||player.closed)renderStudent();throw e;}});
 el('getHint').onclick=()=>run(async()=>{if(paused)return;el('getHint').disabled=true;const d=await api({...cred,action:'hint',index:player.progress,revision:player.revision});player=d.player;hint=d.hint;el('hintBox').textContent=hint;el('hintBox').classList.remove('hidden');});
}
function renderAnswer(){const q=player.question;const a=el('answerArea');if(q.type==='choice'){a.innerHTML=q.options.map((x,i)=>'<button class="choice" id="choice'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span>'+esc(x)+'</button>').join('');q.options.forEach((x,i)=>el('choice'+i).onclick=()=>{selected=x;q.options.forEach((_,j)=>{el('choice'+j).classList.toggle('selected',j===i);el('choice'+j).setAttribute('aria-pressed',j===i?'true':'false');});});}else if(q.type==='number'){a.innerHTML='<label for="numberAnswer">Your answer (number only)</label><input id="numberAnswer" inputmode="decimal" autocomplete="off">';}else if(q.type==='match'){a.innerHTML=q.labels.map((label,i)=>'<label for="match'+i+'">'+esc(label)+'</label><select id="match'+i+'"><option value="">Choose a match</option>'+q.options.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select>').join('');}else{a.innerHTML='<p class="muted">Use Move up and Move down to place the steps in order.</p>'+sequence.map((x,i)=>'<div class="sequence"><b>'+(i+1)+'</b><span>'+esc(x)+'</span><button id="up'+i+'" aria-label="Move step '+(i+1)+' up" '+(i===0?'disabled':'')+'>↑</button><button id="down'+i+'" aria-label="Move step '+(i+1)+' down" '+(i===sequence.length-1?'disabled':'')+'>↓</button></div>').join('');sequence.forEach((_,i)=>{el('up'+i).onclick=()=>{[sequence[i-1],sequence[i]]=[sequence[i],sequence[i-1]];renderAnswer();};el('down'+i).onclick=()=>{[sequence[i+1],sequence[i]]=[sequence[i],sequence[i+1]];renderAnswer();};});}}
function startHost(){stop();mode='host';renderHost();poll=setInterval(async()=>{if(busy||mode!=='host')return;try{host=await api({...cred,action:'host'});renderRows();clearError();}catch(e){problem(e);}},4000);}
function renderHost(){app.innerHTML='<div class="titlebar"><div><div class="eyebrow">Teacher desk · Live class session</div><h1>Progress monitor</h1></div><div><small class="muted">Student class code</small><div class="code">'+esc(cred.code)+'</div></div></div><div class="toolbar"><button id="copyLink">Copy student link</button><button id="export">Export progress CSV</button><span id="refresh" class="muted right">Updates every 4 seconds</span></div><section class="card spaced"><h3>Session controls</h3><p class="muted">The timer starts separately when each student joins. Changes apply to all current students using their original start time. Choosing no limit lets timed-out students continue.</p><div class="settings"><div>'+limitControls(host.minutes)+'</div><label class="check"><input id="closed" type="checkbox" '+(host.closed?'checked':'')+'> Close this session</label><button id="applySettings" data-busy class="primary">Apply settings</button></div><div id="settingStatus" aria-live="polite"></div></section><div id="stats" class="stats spaced"></div><div class="tablewrap"><table><thead><tr><th>Student</th><th>Progress</th><th>Current room</th><th>Incorrect</th><th>Hints</th><th>Time</th><th>Status</th></tr></thead><tbody id="studentRows"></tbody></table></div><p class="muted spaced">No student limit is imposed. Each student needs their own browser or device and an internet connection.</p><details><summary>Save your private teacher key</summary><p class="muted">This key opens this session’s dashboard on another browser. Do not share it with students. Share only the student link and class code.</p><p class="break">'+esc(cred.token)+'</p><button id="downloadTeacher">Download teacher key</button></details><details><summary>How to run the activity</summary><ol><li>Create a session with no time limit or your chosen number of minutes.</li><li>Give students the student link and the class code above.</li><li>Ask each student to enter a name or assigned nickname once.</li><li>Keep this dashboard open to follow progress. Students can resume with their saved key.</li><li>Export the progress CSV at the end. Close the session when the class is done.</li></ol></details>';
 wireLimit();renderRows();el('applySettings').onclick=()=>run(async()=>{const minutes=minutesValue();el('applySettings').disabled=true;host=await api({...cred,action:'settings',minutes,closed:el('closed').checked});renderRows();el('settingStatus').textContent='Settings saved. '+(minutes?'Each student has '+minutes+' minutes from their own start time.':'No time limit.');});el('copyLink').onclick=()=>run(async()=>{const u=new URL(location.href);u.search='?code='+cred.code;u.hash='';try{await navigator.clipboard.writeText(u.href);el('copyLink').textContent='Student link copied';}catch{throw new Error('Copy this student link: '+u.href);}});el('export').onclick=()=>{const rows=[['Student','Solved','Room','Incorrect attempts','Hints','Seconds elapsed','Status'],...host.players.map(p=>[p.name,p.progress,p.finished?'Escaped':roomNames[Math.floor(p.progress/5)],p.mistakes,p.hints,Math.floor(((p.finished||host.serverNow)-p.started)/1000),status(p)])];download('ACR106_Progress_'+cred.code+'.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"'").replaceAll('"','""')+'"').join(',')).join('\r\n'));};el('downloadTeacher').onclick=()=>download('ACR106_Teacher_Key_'+cred.code+'.txt','Class code: '+cred.code+'\nPrivate teacher key: '+cred.token+'\nDo not share this key with students.');}
function status(p){return p.finished?'Escaped':p.closed?'Session closed':p.expired?'Time up':host.serverNow-p.seen>20000?'Not recently active':'In progress';}
function renderRows(){if(!el('studentRows'))return;const ps=host.players;el('stats').innerHTML=[['Joined',ps.length],['In progress',ps.filter(p=>!p.finished&&!p.expired&&!p.closed).length],['Escaped',ps.filter(p=>p.finished).length],['Average solved',ps.length?Math.round(ps.reduce((s,p)=>s+p.progress,0)/ps.length)+'/30':'—']].map(([a,b])=>'<div class="stat"><small>'+a+'</small><strong>'+b+'</strong></div>').join('');el('studentRows').innerHTML=ps.length?ps.map(p=>'<tr><td><b>'+esc(p.name)+'</b><details><summary>Attempt history</summary>'+p.log.map(x=>'<small>Q'+(x.q+1)+' · '+esc(x.type)+'</small>').join('')+'</details></td><td>'+p.progress+'/30<div class="progress"><div style="width:'+p.progress/30*100+'%"></div></div></td><td>'+(p.finished?'All rooms complete':roomNames[Math.floor(p.progress/5)])+'</td><td>'+p.mistakes+'</td><td>'+p.hints+'</td><td>'+timeText((p.finished||host.serverNow)-p.started)+(p.expires&&!p.finished?'<small>'+timeText(p.expires-host.serverNow)+' left</small>':'<small>'+(p.finished?'Completed':'No time limit')+'</small>')+'</td><td><span class="badge '+(p.finished?'finished':p.expired?'expired':'')+'">'+status(p)+'</span></td></tr>').join(''):'<tr><td colspan="7">Waiting for students. Share the student link and class code to begin.</td></tr>';el('refresh').textContent='Last updated '+new Date(host.serverNow).toLocaleTimeString()+' · every 4 seconds';}
function download(filename,text){const url=URL.createObjectURL(new Blob([text],{type:filename.endsWith('.csv')?'text/csv;charset=utf-8':'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
el('homeBtn').onclick=()=>{clearError();lobby();};lobby();const incoming=new URLSearchParams(location.search).get('code');if(incoming&&el('code'))el('code').value=incoming;
